{% if breadcrumb_current_name is defined and breadcrumb_current_url is defined %}
<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "BreadcrumbList",
		"itemListElement": [
			{
				"@type": "ListItem",
				"position": 1,
				"name": "Home",
				"item": {{ get_url(path='/', trailing_slash=true) | json_encode | safe }}
			},
			{% if breadcrumb_parent_name is defined and breadcrumb_parent_url is defined %}
			{
				"@type": "ListItem",
				"position": 2,
				"name": {{ breadcrumb_parent_name | json_encode | safe }},
				"item": {{ breadcrumb_parent_url | json_encode | safe }}
			},
			{
				"@type": "ListItem",
				"position": 3,
				"name": {{ breadcrumb_current_name | json_encode | safe }},
				"item": {{ breadcrumb_current_url | json_encode | safe }}
			}
			{% else %}
			{
				"@type": "ListItem",
				"position": 2,
				"name": {{ breadcrumb_current_name | json_encode | safe }},
				"item": {{ breadcrumb_current_url | json_encode | safe }}
			}
			{% endif %}
		]
	}
</script>
{% endif %}

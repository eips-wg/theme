{% if structured_data_page_name is defined and structured_data_page_url is defined %}
<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "CollectionPage",
		"url": {{ structured_data_page_url | json_encode | safe }},
		"name": {{ structured_data_page_name | json_encode | safe }},
		{% if structured_data_page_description is defined and structured_data_page_description %}
		"description": {{ structured_data_page_description | json_encode | safe }},
		{% endif %}
		"isPartOf": {
			"@type": "WebSite",
			"name": {{ config.title | json_encode | safe }},
			"url": {{ get_url(path='/', trailing_slash=true) | json_encode | safe }}
		}
	}
</script>
{% endif %}
